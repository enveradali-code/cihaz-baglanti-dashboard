<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Cihaz Bağlantı Analizi</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--card:#fff;--line:#e8eaf1;--text:#111827;--muted:#5b6475;--indigo:#4f46e5;--red:#e11d48}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#171b2c;--line:#272c42;--text:#eef0f7;--muted:#9aa3b8}}
:root[data-theme="dark"]{--bg:#0f1220;--card:#171b2c;--line:#272c42;--text:#eef0f7;--muted:#9aa3b8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;padding:16px}
.box{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px}
.logo{width:52px;height:52px;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#db2777);display:grid;place-items:center;color:#fff;margin-bottom:18px}
h1{font-size:20px;margin:0 0 6px}
p{color:var(--muted);font-size:14px;margin:0 0 22px;line-height:1.5}
input{width:100%;font:15px Inter;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
input:focus{outline:2px solid var(--indigo);outline-offset:1px}
button{width:100%;font:600 15px Inter;color:#fff;background:var(--indigo);border:0;border-radius:10px;padding:12px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--red);font-size:14px;min-height:20px;margin-top:12px}
</style>
</head>
<body>
<form class="box" id="f">
  <div class="logo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
  <h1>Cihaz Bağlantı &amp; Şehir Analizi</h1>
  <p>Bu dashboard şifre ile korunmaktadır. Devam etmek için şifreyi girin.</p>
  <input type="password" id="pw" placeholder="Şifre" autocomplete="current-password" autofocus required>
  <button id="b">Giriş</button>
  <div class="err" id="e"></div>
</form>
